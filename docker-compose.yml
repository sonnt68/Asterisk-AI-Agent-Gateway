services:
  api:
    build:
      context: .
      dockerfile: apps/control-api/Dockerfile
    environment:
      GATEWAY_API_HOST: ${GATEWAY_API_HOST:-0.0.0.0}
      GATEWAY_API_PORT: ${GATEWAY_API_PORT:-8080}
      GATEWAY_WEB_ORIGIN: ${GATEWAY_WEB_ORIGIN:-http://localhost:5173}
      GATEWAY_DATABASE_URL: ${GATEWAY_DATABASE_URL:-postgresql+psycopg://asterisk_ai_gateway:${POSTGRES_PASSWORD}@postgres:5432/asterisk_ai_gateway}
      GATEWAY_SESSION_SECRET: ${GATEWAY_SESSION_SECRET:?Set GATEWAY_SESSION_SECRET in .env}
      GATEWAY_API_KEY_PEPPER: ${GATEWAY_API_KEY_PEPPER:?Set GATEWAY_API_KEY_PEPPER in .env}
      GATEWAY_BOOTSTRAP_EMAIL: ${GATEWAY_BOOTSTRAP_EMAIL}
      GATEWAY_BOOTSTRAP_PASSWORD: ${GATEWAY_BOOTSTRAP_PASSWORD}
      GATEWAY_COOKIE_SECURE: ${GATEWAY_COOKIE_SECURE:-false}
      GATEWAY_BROWSER_SESSION_MAX_AGE: ${GATEWAY_BROWSER_SESSION_MAX_AGE:-28800}
      GATEWAY_TOKEN_RATE_LIMIT_PER_MINUTE: ${GATEWAY_TOKEN_RATE_LIMIT_PER_MINUTE:-60}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      ASTERISK_ARI_BASE_URL: ${ASTERISK_ARI_BASE_URL}
      ASTERISK_ARI_USERNAME: ${ASTERISK_ARI_USERNAME}
      ASTERISK_ARI_PASSWORD: ${ASTERISK_ARI_PASSWORD}
      AUDIOSOCKET_HOST: 0.0.0.0
      AUDIOSOCKET_PORT: ${AUDIOSOCKET_PORT:-8090}
      AUDIOSOCKET_ADVERTISE_HOST: ${AUDIOSOCKET_ADVERTISE_HOST:-api}
      GATEWAY_MEDIA_TRANSPORT: ${GATEWAY_MEDIA_TRANSPORT:-audiosocket}
      GATEWAY_MEDIA_SAMPLE_RATE: ${GATEWAY_MEDIA_SAMPLE_RATE:-8000}
      EXTERNAL_MEDIA_HOST: 0.0.0.0
      EXTERNAL_MEDIA_ADVERTISE_HOST: ${EXTERNAL_MEDIA_ADVERTISE_HOST:-api}
    ports:
      - "127.0.0.1:${GATEWAY_API_PORT:-8080}:8080"
    expose:
      - "8090"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - default
      - asterisk-private

  gateway:
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      ASTERISK_ARI_BASE_URL: ${ASTERISK_ARI_BASE_URL}
      ASTERISK_ARI_USERNAME: ${ASTERISK_ARI_USERNAME}
      ASTERISK_ARI_PASSWORD: ${ASTERISK_ARI_PASSWORD}
    depends_on:
      redis:
        condition: service_healthy

  admin-ui:
    build:
      context: apps/admin-ui
    ports:
      # Loopback by default; set GATEWAY_ADMIN_BIND=0.0.0.0 to expose the
      # dashboard directly (do this only behind TLS or on a trusted network).
      - "${GATEWAY_ADMIN_BIND:-127.0.0.1}:${GATEWAY_ADMIN_PORT:-5173}:80"
    depends_on:
      - api

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-asterisk_ai_gateway}
      POSTGRES_USER: ${POSTGRES_USER:-asterisk_ai_gateway}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  redis-data:

networks:
  asterisk-private:
    name: ${ASTERISK_DOCKER_NETWORK:?Set ASTERISK_DOCKER_NETWORK in .env}
    external: true
