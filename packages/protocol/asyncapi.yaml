asyncapi: 3.0.0
info:
  title: Asterisk AI Agent Gateway Realtime Protocol
  version: 1.0.0
  description: >-
    Partner-facing realtime protocol. JSON text frames carry lifecycle and
    control events. Binary frames carry a 16-byte RFC 4122 gateway call UUID
    followed by PCM signed 16-bit little-endian mono 16 kHz audio.
servers:
  partner:
    host: gateway.example.com
    protocol: wss
    description: Partner realtime endpoint.
channels:
  /v1/realtime:
    address: /v1/realtime
    messages:
      sessionRegister:
        $ref: '#/components/messages/SessionRegister'
      callStarted:
        $ref: '#/components/messages/CallStarted'
      callControl:
        $ref: '#/components/messages/CallControl'
      callControlAccepted:
        $ref: '#/components/messages/CallControlAccepted'
      callEnded:
        $ref: '#/components/messages/CallEnded'
      outboundOriginate:
        $ref: '#/components/messages/OutboundOriginate'
      outboundAccepted:
        $ref: '#/components/messages/OutboundAccepted'
      transferConsulting:
        $ref: '#/components/messages/TransferConsulting'
      error:
        $ref: '#/components/messages/Error'
components:
  messages:
    SessionRegister:
      payload:
        type: object
        required: [type, agent_slug, protocol_version]
        properties:
          type: { const: session.register }
          agent_slug: { type: string }
          protocol_version: { const: '1' }
    CallStarted:
      payload:
        type: object
        required: [type, call_id, sequence]
        properties:
          type: { const: call.started }
          call_id: { type: string }
          sequence: { type: integer, minimum: 1 }
          media:
            type: object
            properties:
              # Negotiated per deployment, not fixed: the transport and the
              # operator's configured rate decide it. Partners must read these
              # fields rather than assume a format.
              encoding: { enum: [pcm_s16le, pcm_mulaw] }
              sample_rate: { type: integer, enum: [8000, 12000, 16000, 24000] }
              channels: { const: 1 }
    CallControl:
      payload:
        type: object
        required: [type, call_id, command]
        properties:
          type: { const: call.control }
          request_id: { type: string, format: uuid }
          call_id: { type: string }
          command: { type: string }
          payload: { type: object }
    CallControlAccepted:
      payload:
        type: object
        required: [type, call_id]
        properties:
          type: { const: call.control.accepted }
          call_id: { type: string, format: uuid }
          request_id: { type: string, format: uuid }
          result:
            type: object
            description: >-
              Present only when the command produces a value the partner needs
              later. playback.start returns the playback_id that playback.stop
              requires.
            properties:
              playback_id: { type: string, format: uuid }
    CallEnded:
      payload:
        type: object
        required: [type, call_id]
        properties:
          type: { const: call.ended }
          call_id: { type: string, format: uuid }
    OutboundOriginate:
      payload:
        type: object
        required: [type, payload]
        properties:
          type: { const: outbound.originate }
          request_id: { type: string, format: uuid }
          payload:
            type: object
            required: [context, extension]
            properties:
              context: { type: string }
              extension: { type: string }
              timeout: { type: integer, minimum: 1, maximum: 120 }
    OutboundAccepted:
      payload:
        type: object
        required: [type, call_id]
        properties:
          type: { const: outbound.accepted }
          call_id: { type: string, format: uuid }
          request_id: { type: string, format: uuid }
    TransferConsulting:
      payload:
        type: object
        required: [type, call_id]
        properties:
          type: { const: transfer.consulting }
          call_id: { type: string, format: uuid }
    Error:
      payload:
        type: object
        required: [type, code, message]
        properties:
          type: { const: error }
          code: { type: string }
          message: { type: string }
