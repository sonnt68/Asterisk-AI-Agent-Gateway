openapi: 3.1.0
info:
  title: Asterisk AI Agent Gateway Control API
  version: 1.0.0
  description: Versioned SaaS control-plane and partner authentication API.
servers:
  - url: https://gateway.example.com/api/v1
paths:
  /auth/login:
    post:
      operationId: login
      summary: Create an HttpOnly dashboard session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 12 }
      responses:
        '200': { description: Authenticated }
        '401': { description: Invalid credentials }
  /organizations/{organization_id}/partner-apps:
    parameters:
      - in: path
        name: organization_id
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: listPartnerApps
      responses:
        '200': { description: Tenant-scoped partner applications }
    post:
      operationId: createPartnerApp
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PartnerAppRequest' }
      responses:
        '201': { description: Partner application created }
  /partner-apps/{app_id}/api-keys:
    parameters:
      - in: path
        name: app_id
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: listApiKeys
      responses:
        '200':
          description: Key metadata without plaintext or recoverable ciphertext
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ApiKeyMetadata' }
    post:
      operationId: createApiKey
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiKeyRequest' }
      responses:
        '201':
          description: Plaintext key returned once
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IssuedApiKey' }
  /partner-apps/{app_id}:
    patch:
      operationId: updatePartnerApp
      summary: Update a Partner App display name or management policy
      description: >-
        Tenant-scoped Owner/Admin/Developer action. When name is supplied, the
        server trims surrounding whitespace and accepts 1-120 characters after
        trimming. Renaming changes only the display name; agent_slug, API keys,
        call history and phone-number references remain unchanged. Deleted
        Partner Apps cannot be updated.
      parameters:
        - in: path
          name: app_id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PartnerAppUpdate' }
      responses:
        '200': { description: Updated tenant-scoped Partner App }
        '404': { description: Partner App not found in the authenticated organization }
        '422': { description: Name is empty or exceeds 120 characters after trimming }
    delete:
      operationId: deletePartnerApp
      summary: Logically delete a Partner App after explicit key revocation
      description: >-
        Owner/Admin action scoped to the authenticated organization. Every API
        key row, including expired keys, must be explicitly revoked first. If
        any key remains unrevoked, return 409 with no app, key or audit-log
        mutation. A successful delete hides and disables the app, clears
        recoverable key ciphertext, retains history and phone-number references,
        and does not force active calls to end.
      parameters:
        - in: path
          name: app_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Partner App logically deleted }
        '404': { description: Partner App not found in the authenticated organization }
        '409': { description: All API keys must be explicitly revoked before deletion; no mutation is made }
  /api-keys/{key_id}:
    delete:
      operationId: revokeApiKey
      parameters:
        - in: path
          name: key_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Key revoked }
  /api-keys/{key_id}/rotate:
    post:
      operationId: rotateApiKey
      parameters:
        - in: path
          name: key_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '201':
          description: Old key revoked and replacement plaintext returned once
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IssuedApiKey' }
  /api-keys/{key_id}/reveal:
    post:
      operationId: revealApiKey
      summary: Recover an eligible API key for app configuration copy
      description: >-
        Tenant-scoped management action for an Owner, Admin or Developer. It
        returns plaintext only for an active, non-expired key belonging to an
        enabled, non-deleted Partner App with configured encrypted recovery.
        Revoked, expired, deleted or hash-only keys are rejected. The response
        is sent with Cache-Control: no-store and Pragma: no-cache and the
        plaintext is never included in list metadata.
      parameters:
        - in: path
          name: key_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Plaintext key for the explicit copy action only
          headers:
            Cache-Control:
              description: Prevent response caching.
              schema: { type: string, const: no-store }
            Pragma:
              description: Legacy cache prevention header.
              schema: { type: string, const: no-cache }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiKeyReveal' }
        '404': { description: Key not found in the authenticated organization }
        '409': { description: Key is revoked, expired, hash-only, or attached to an unavailable app }
        '503': { description: Encrypted secret recovery is unavailable }
  /api-keys/{key_id}/purge:
    delete:
      operationId: deleteRevokedApiKey
      parameters:
        - in: path
          name: key_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Revoked key record permanently deleted }
        '404': { description: Key not found in the authenticated organization }
        '409': { description: Active keys must be revoked before deletion }
  /realtime/tokens:
    post:
      operationId: createRealtimeToken
      security: [{ partnerApiKey: [] }]
      responses:
        '200':
          description: Five-minute realtime token
          content:
            application/json:
              schema:
                type: object
                required: [token, expires_in]
                properties:
                  token: { type: string }
                  expires_in: { type: string, const: '300' }
  /system/health:
    get:
      operationId: getSystemHealth
      summary: Check control API availability
      responses:
        '200':
          description: Control API is accepting requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /asterisk:
    get:
      operationId: getAsteriskConfiguration
      responses:
        '200': { description: Sanitized singular Asterisk configuration and transport }
  /asterisk/provisioning:
    get:
      operationId: getAsteriskProvisioning
      summary: Read PBX bridge readiness for the configured operator organization
      responses:
        '200':
          description: Sanitized provisioning status; non-operator principals see no PBX details.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AsteriskProvisioningStatus' }
  /asterisk/trunks:
    get:
      operationId: listAsteriskTrunks
      responses:
        '200':
          description: Sanitized FreePBX PJSIP trunk inventory
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Trunk' }
        '403': { description: Owner/Admin of the configured operator organization required }
    post:
      operationId: createAsteriskTrunk
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TrunkCreate' }
      responses:
        '201':
          description: Sanitized trunk after bridge save
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Trunk' }
        '403': { description: Owner/Admin of the configured operator organization required }
  /asterisk/trunks/{trunk_id}:
    parameters:
      - in: path
        name: trunk_id
        required: true
        schema: { type: string, maxLength: 120 }
    patch:
      operationId: updateAsteriskTrunk
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TrunkPatch' }
      responses:
        '200':
          description: Sanitized trunk after bridge save
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Trunk' }
        '403': { description: Owner/Admin of the configured operator organization required }
  /asterisk/apply:
    post:
      operationId: applyAsteriskConfiguration
      responses:
        '200':
          description: Exact managed DID routes applied after guarded PBX reload/readback
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApplyResponse' }
        '409': { description: Active gateway calls prevent reload }
        '403': { description: Owner/Admin of the configured operator organization required }
  /phone-numbers:
    get:
      operationId: listPhoneNumbers
      responses:
        '200':
          description: Tenant-scoped exact DID mappings
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PhoneNumber' }
        '403': { description: Owner/Admin of the configured operator organization required }
    post:
      operationId: createPhoneNumber
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PhoneNumberCreate' }
      responses:
        '201':
          description: Mapping saved and left pending until explicit apply
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PhoneNumber' }
        '409': { description: Exact number is already mapped }
  /phone-numbers/{phone_id}:
    parameters:
      - in: path
        name: phone_id
        required: true
        schema: { type: string, format: uuid }
    patch:
      operationId: updatePhoneNumber
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PhoneNumberPatch' }
      responses:
        '200':
          description: Local mapping update; PBX reload is not required
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PhoneNumber' }
  /runtime:
    get:
      operationId: getRuntimeSummary
      responses:
        '200': { description: Tenant-scoped readiness and active counts }
  /connections:
    get:
      operationId: listActiveConnections
      responses:
        '200': { description: Tenant-scoped active partner connections }
  /calls:
    get:
      operationId: listActiveCalls
      responses:
        '200': { description: Tenant-scoped active gateway calls }
  /partner/calls:
    get:
      operationId: listPartnerCalls
      summary: List durable calls owned by this partner app
      description: >-
        Direct API-key read. Requires calls:read and restricts results to the
        authenticated key's organization and partner app. It does not use a
        realtime token or WebSocket session.
      security: [{ partnerApiKey: [] }]
      parameters:
        - in: query
          name: limit
          description: Page size; defaults to 50.
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - in: query
          name: cursor
          description: Opaque cursor returned as next_cursor.
          schema: { type: string, maxLength: 200 }
        - in: query
          name: page
          description: >-
            One-based numbered page. Cannot be combined with cursor. Includes
            page, page_size, total and total_pages; next_cursor is null.
            Concurrent new calls can shift the contents of numbered pages.
          schema: { type: integer, minimum: 1, maximum: 2147483647 }
        - in: query
          name: agent_slug
          description: Exact historic agent slug; never broadens API-key ownership.
          schema: { type: string, minLength: 1, maxLength: 80 }
        - in: query
          name: status
          schema: { $ref: '#/components/schemas/CallStatus' }
        - in: query
          name: direction
          schema: { $ref: '#/components/schemas/CallDirection' }
        - in: query
          name: started_after
          description: ISO 8601 timestamp with an explicit timezone.
          schema: { type: string, format: date-time }
        - in: query
          name: started_before
          description: ISO 8601 timestamp with an explicit timezone.
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Newest-first durable call summaries.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CallHistoryPage' }
        '401': { description: Missing, malformed, expired, or revoked API key }
        '403': { description: Key lacks calls:read or the partner app is disabled }
        '422': { description: Invalid filter or combined page and cursor pagination }
  /partner/calls/{call_id}:
    parameters:
      - in: path
        name: call_id
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getPartnerCall
      summary: Get one durable call summary
      description: Unknown and non-owned IDs return the same 404 response.
      security: [{ partnerApiKey: [] }]
      responses:
        '200':
          description: Durable call metadata and latest normalized status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CallHistoryItem' }
        '401': { description: Missing, malformed, expired, or revoked API key }
        '403': { description: Key lacks calls:read or the partner app is disabled }
        '404': { description: Call not found in the key's organization and partner app }
  /partner/calls/{call_id}/signals:
    parameters:
      - in: path
        name: call_id
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: listPartnerCallSignals
      summary: List durable status signals for one call
      description: Signals are ordered by ascending sequence.
      security: [{ partnerApiKey: [] }]
      parameters:
        - in: query
          name: limit
          description: Page size; defaults to 50.
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - in: query
          name: cursor
          description: Opaque signal cursor returned as next_cursor.
          schema: { type: string, maxLength: 200 }
      responses:
        '200':
          description: Ascending durable status-signal page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CallSignalPage' }
        '401': { description: Missing, malformed, expired, or revoked API key }
        '403': { description: Key lacks calls:read or the partner app is disabled }
        '404': { description: Call not found in the key's organization and partner app }
  /audit-events:
    get:
      operationId: listAuditEvents
      responses:
        '200': { description: Latest tenant audit events }
  /organization/members:
    get:
      operationId: listOrganizationMembers
      responses:
        '200': { description: Tenant membership and roles }
components:
  securitySchemes:
    partnerApiKey:
      type: http
      scheme: bearer
  schemas:
    PartnerAppRequest:
      type: object
      required: [name, agent_slug]
      properties:
        name: { type: string, maxLength: 120 }
        agent_slug: { type: string, pattern: '^[a-z0-9-]{3,80}$' }
        scopes:
          type: array
          items: { type: string }
          default: [calls:read, media:stream, calls:originate]
          description: >-
            Defaults to calls:read, media:stream and calls:originate. Explicit
            scope lists are normalized and validated against the allowlist.
        allowed_destinations: { type: array, items: { type: string } }
    PartnerAppUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
          description: Display name; the server trims surrounding whitespace before validation.
        enabled: { type: boolean }
        scopes: { type: array, items: { type: string } }
        allowed_destinations: { type: array, items: { type: string } }
    ApiKeyRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 120 }
        scopes:
          type: array
          items: { type: string }
          description: >-
            Optional. When omitted, the key receives the intersection of the
            default scopes calls:read, media:stream and calls:originate with
            the current Partner App scopes. An explicit list, including an
            empty list, is preserved after normalization and must be a subset
            of the Partner App scopes.
        expires_at: { type: [string, 'null'], format: date-time }
    ApiKeyMetadata:
      type: object
      description: >-
        Tenant-scoped key metadata. Plaintext and encrypted secrets are never
        returned. copy_available is true only when the explicit reveal action
        can recover an active, non-expired key for an enabled app.
      required: [id, name, prefix, scopes, created_at, last_used_at, revoked_at, expires_at, copy_available]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        prefix: { type: string }
        scopes: { type: array, items: { type: string } }
        created_at: { type: string, format: date-time }
        last_used_at: { type: [string, 'null'], format: date-time }
        revoked_at: { type: [string, 'null'], format: date-time }
        expires_at: { type: [string, 'null'], format: date-time }
        copy_available: { type: boolean }
    ApiKeyReveal:
      type: object
      required: [key, partner_app_id, agent_slug]
      properties:
        key: { type: string, description: Plaintext API key returned only by the explicit no-store reveal action. }
        partner_app_id: { type: string, format: uuid }
        agent_slug: { type: string }
    IssuedApiKey:
      type: object
      required: [id, prefix, key, scopes]
      properties:
        id: { type: string, format: uuid }
        prefix: { type: string }
        key: { type: string, writeOnly: true }
        scopes: { type: array, items: { type: string } }
        replaces: { type: string, format: uuid }
    CallStatus:
      type: string
      enum: [dialing, ringing, answered, completed, busy, no_answer, rejected, unavailable, failed, cancelled]
    CallDirection:
      type: string
      enum: [inbound, outbound, unknown]
    CallHistoryItem:
      type: object
      required:
        - call_id
        - partner_app_id
        - agent_slug
        - direction
        - source
        - status
        - terminal
        - answered
        - reason
        - hangup_cause
        - dial_status
        - sequence
        - created_at
        - updated_at
        - answered_at
        - ended_at
        - duration_seconds
        - talk_seconds
        - history_complete
      properties:
        call_id: { type: string, format: uuid }
        partner_app_id: { type: [string, 'null'], format: uuid }
        agent_slug: { type: [string, 'null'] }
        direction: { $ref: '#/components/schemas/CallDirection' }
        source: { type: string, enum: [gateway, imported] }
        status: { $ref: '#/components/schemas/CallStatus' }
        terminal: { type: boolean }
        answered: { type: boolean }
        reason: { type: [string, 'null'] }
        hangup_cause: { type: [integer, 'null'] }
        dial_status: { type: [string, 'null'] }
        sequence: { type: integer, minimum: 0 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        answered_at: { type: [string, 'null'], format: date-time }
        ended_at: { type: [string, 'null'], format: date-time }
        duration_seconds: { type: [number, 'null'], minimum: 0 }
        talk_seconds: { type: [number, 'null'], minimum: 0 }
        history_complete: { type: boolean }
    CallSignalItem:
      type: object
      required: [type, call_id, status, sequence, terminal, answered, reason, hangup_cause, dial_status, updated_at]
      properties:
        type: { type: string, const: call.status }
        call_id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/CallStatus' }
        sequence: { type: integer, minimum: 0 }
        terminal: { type: boolean }
        answered: { type: boolean }
        reason: { type: [string, 'null'] }
        hangup_cause: { type: [integer, 'null'] }
        dial_status: { type: [string, 'null'] }
        updated_at: { type: string, format: date-time }
    CallHistoryPage:
      type: object
      required: [items, next_cursor, page, page_size, total, total_pages]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/CallHistoryItem' }
        next_cursor: { type: [string, 'null'] }
        page: { type: [integer, 'null'], minimum: 1 }
        page_size: { type: [integer, 'null'], minimum: 1, maximum: 100 }
        total: { type: [integer, 'null'], minimum: 0 }
        total_pages: { type: [integer, 'null'], minimum: 1 }
    CallSignalPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/CallSignalItem' }
        next_cursor: { type: [string, 'null'] }
    HealthResponse:
      type: object
      additionalProperties: false
      required: [service, status, version]
      properties:
        service:
          type: string
          const: control-api
        status:
          type: string
          const: ok
        version:
          type: string
    AsteriskProvisioningStatus:
      type: object
      additionalProperties: false
      required: [configured, can_manage, connected, needs_apply, transports]
      properties:
        configured: { type: boolean }
        can_manage: { type: boolean }
        connected: { type: boolean }
        needs_apply: { type: boolean }
        transports:
          type: array
          items: { type: string }
        error: { type: string }
    Trunk:
      type: object
      additionalProperties: false
      required: [id, name, host, port, transport, authentication, registration, username, auth_username, match, from_domain, from_user, contact_user, outbound_caller_id, codecs, enabled, password_set]
      properties:
        id: { type: string }
        name: { type: string, minLength: 1, maxLength: 120 }
        host: { type: string, maxLength: 253 }
        port: { type: integer, minimum: 1, maximum: 65535, default: 5060 }
        transport: { type: string, description: Exact existing PBX transport name }
        authentication: { type: string, description: Common managed values are none and outbound; other native values are returned for inventory and are read-only. }
        registration: { type: string, description: Common managed values are none and send; other native values are returned for inventory and are read-only. }
        username: { type: string, maxLength: 120 }
        auth_username: { type: string, maxLength: 120 }
        match: { type: string, description: Comma-separated IP/CIDR list }
        from_domain: { type: string, maxLength: 253 }
        from_user: { type: string, maxLength: 120 }
        contact_user: { type: string, maxLength: 120 }
        outbound_caller_id: { type: string, maxLength: 120 }
        codecs: { type: array, items: { type: string } }
        enabled: { type: boolean }
        password_set: { type: boolean, readOnly: true }
    TrunkCreate:
      type: object
      additionalProperties: false
      required: [name, host]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        host: { type: string, maxLength: 253 }
        port: { type: integer, minimum: 1, maximum: 65535, default: 5060 }
        transport: { type: string }
        authentication: { type: string, enum: [none, outbound] }
        registration: { type: string, enum: [none, send] }
        username: { type: string, maxLength: 120 }
        auth_username: { type: string, maxLength: 120 }
        password: { type: string, writeOnly: true, maxLength: 256 }
        match: { type: string }
        from_domain: { type: string, maxLength: 253 }
        from_user: { type: string, maxLength: 120 }
        contact_user: { type: string, maxLength: 120 }
        outbound_caller_id: { type: string, maxLength: 120 }
        codecs: { type: array, items: { type: string } }
        enabled: { type: boolean, default: true }
    TrunkPatch:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        host: { type: string, maxLength: 253 }
        port: { type: integer, minimum: 1, maximum: 65535 }
        transport: { type: string }
        authentication: { type: string, enum: [none, outbound] }
        registration: { type: string, enum: [none, send] }
        username: { type: string, maxLength: 120 }
        auth_username: { type: string, maxLength: 120 }
        password: { type: string, writeOnly: true, maxLength: 256 }
        match: { type: string }
        from_domain: { type: string, maxLength: 253 }
        from_user: { type: string, maxLength: 120 }
        contact_user: { type: string, maxLength: 120 }
        outbound_caller_id: { type: string, maxLength: 120 }
        codecs: { type: array, items: { type: string } }
        enabled: { type: boolean }
    PhoneNumber:
      type: object
      additionalProperties: false
      required: [id, number, label, partner_app_id, partner_app_name, agent_slug, outbound_partner_app_ids, outbound_partner_apps, enabled, pbx_applied, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        number: { type: string, pattern: '^\+?[0-9]{1,32}$' }
        label: { type: string, maxLength: 120 }
        partner_app_id: { type: string, format: uuid }
        partner_app_name: { type: string }
        agent_slug: { type: string }
        outbound_partner_app_ids:
          type: array
          uniqueItems: true
          items: { type: string, format: uuid }
        outbound_partner_apps:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, name, agent_slug, enabled]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
