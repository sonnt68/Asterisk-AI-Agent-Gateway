[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "asterisk-ai-agent-gateway-sdk"
version = "0.1.0"
description = "Python realtime client for Asterisk AI Agent Gateway"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1.0", "websockets>=13,<18"]

[tool.hatch.build.targets.wheel]
packages = ["src/asterisk_ai_gateway"]
