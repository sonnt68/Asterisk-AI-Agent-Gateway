name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python tests and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project and partner SDK
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install -e ./sdks/python

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

  node:
    name: Node SDK and admin UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Partner SDK tests
        working-directory: sdks/node
        run: |
          npm install
          npm test

      - name: Admin UI typecheck and build
        working-directory: apps/admin-ui
        run: |
          npm ci
          npm run build
