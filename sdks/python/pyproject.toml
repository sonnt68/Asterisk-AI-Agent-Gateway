[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["asterisk_ai_gateway"]

[project]
name = "asterisk-ai-agent-gateway-sdk"
version = "0.2.0"
description = "Partner SDK for the Asterisk AI Agent Gateway realtime protocol v1"
readme = "README.md"
# Deliberately wider than the gateway's own floor: partners run their own
# stacks and must not be forced onto the server's Python version.
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "aiohttp>=3.10,<4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
]

[project.urls]
Documentation = "https://github.com/asterisk-ai-agent-gateway/docs/partner/integration-guide.html"
