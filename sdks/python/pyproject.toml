[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["asterisk_ai_gateway"]

[project]
name = "asterisk-ai-agent-gateway-sdk"
version = "0.4.0"
description = "Partner SDK for AI Agent Gateway realtime and call-history APIs"
readme = "README.md"
# Deliberately wider than the gateway's own floor: partners run their own
# stacks and must not be forced onto the server's Python version.
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "aiohttp>=3.10,<4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
]

[project.urls]
Documentation = "https://github.com/sonnt68/Asterisk-AI-Agent-Gateway/blob/main/docs/partner/integration-guide.html"
Repository = "https://github.com/sonnt68/Asterisk-AI-Agent-Gateway"
Issues = "https://github.com/sonnt68/Asterisk-AI-Agent-Gateway/issues"
